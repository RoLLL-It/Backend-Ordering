name: rollit-api
region: blr1

services:
  - name: api
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: RoLLL-It/Backend-Ordering
      branch: main
      deploy_on_push: true
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /health
      initial_delay_seconds: 10
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: JWT_ACCESS_TTL
        scope: RUN_TIME
        value: "15m"
      - key: REFRESH_TTL
        scope: RUN_TIME
        value: "720h"
      - key: BCRYPT_COST
        scope: RUN_TIME
        value: "12"
      - key: PORT
        scope: RUN_TIME
        value: "8080"
      - key: CORS_ALLOWED_ORIGINS
        scope: RUN_TIME
        value: "http://localhost:3000"
      - key: S3_ENDPOINT
        scope: RUN_TIME
        type: SECRET
      - key: S3_BUCKET
        scope: RUN_TIME
        type: SECRET
      - key: S3_ACCESS_KEY
        scope: RUN_TIME
        type: SECRET
      - key: S3_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: LOG_LEVEL
        scope: RUN_TIME
        value: "info"
      - key: ENV
        scope: RUN_TIME
        value: "production"
